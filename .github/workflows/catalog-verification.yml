name: Catalog verification

on:
  schedule:
    # 04:30 UTC, before the 05:00 catalog snapshot. One batch per day.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-product-verification.ts
        env:
          VERIFY_BATCH: "20"
      - name: Commit the new checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-verification
          if git diff --cached --quiet; then
            echo "No new verification results."
          else
            git commit -m "Record catalog verification batch"
            git push
          fi
